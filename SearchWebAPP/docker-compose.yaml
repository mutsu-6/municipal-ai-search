version: "3.9"
services:
  app:
    build: .
    command: streamlit run app/main.py --server.port 8501 --server.address 0.0.0.0 --server.enableCORS false
    ports: ["8501:8501"]
    volumes:
      - .:/app  # hot‑reload during development
    env_file: [".env"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=searchapp
      - MYSQL_PORT=3306

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: searchapp
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
